version: '3.8'
services:
  db:
    image: mariadb:10.6
    container_name: dolibarr_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: dolibarr_root
      MYSQL_DATABASE: dolibarr
      MYSQL_USER: dolibarr
      MYSQL_PASSWORD: dolibarr_pass
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3307:3306"

  dolibarr:
    build: .
    container_name: dolibarr_app
    restart: always
    environment:
      DOLI_DB_HOST: db
      DOLI_DB_NAME: dolibarr
      DOLI_DB_USER: dolibarr
      DOLI_DB_PASSWORD: dolibarr_pass
    ports:
      - "8080:80"
    depends_on:
      - db
    volumes:
      - ./htdocs:/var/www/html
      - ./documents:/var/www/documents

volumes:
  db_data:
