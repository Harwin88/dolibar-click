version: "3.8"

services:
  db:
    image: mariadb:10.6
    container_name: dolibarr_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: dolibarr_root
      MYSQL_DATABASE: dolibarr
      MYSQL_USER: dolibarr
      MYSQL_PASSWORD: dolibarr_pass
    volumes:
      - db_data:/var/lib/mysql
    # No exponemos puerto DB públicamente (mejor seguridad).
    # Si necesitas acceso externo temporal, descomenta la siguiente línea:
    # ports:
    #   - "3307:3306"

  dolibarr:
    image: tuxgasy/dolibarr
    container_name: dolibarr_app
    restart: always
    environment:
      DOLI_DB_HOST: db
      DOLI_DB_NAME: dolibarr
      DOLI_DB_USER: dolibarr
      DOLI_DB_PASSWORD: dolibarr_pass
    depends_on:
      - db
    expose:
      - "8080:80"
    volumes:
      - ./htdocs:/var/www/html
      - ./documents:/var/www/documents

  adminer:
    image: adminer:latest
    container_name: dolibarr_adminer
    restart: always
    depends_on:
      - db
    expose:
      - "8080"

  caddy:
    image: caddy:latest
    container_name: caddy_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - dolibarr
      - adminer

volumes:
  db_data:
  caddy_data:
  caddy_config:
